[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-hotpot"
version = "0.1.0"
description = "基于同花顺新闻提及次数的 A 股新闻热度 Windows 桌面工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "PySide6>=6.7,<6.9",
  "rapidfuzz>=3.9,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-qt>=4.4,<5",
]
build = [
  "pyinstaller>=6.10,<7",
]

[project.scripts]
ashare-hotpot = "ashare_hotpot.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
qt_api = "pyside6"
markers = [
  "live: requires network access to 10jqka.com.cn",
]
