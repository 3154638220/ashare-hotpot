<div class="news-content-parsed"><p><span><a class="link-wrapper link-blue" href="https://stockpage.10jqka.com.cn/300033" rel="noopener noreferrer" style="word-break:break-all;cursor:pointer;color:#36F" target="_blank">同花顺（300033）</a></span>金融研究中心08月07日讯，有投资者向<span><a class="link-wrapper link-blue" href="https://stockpage.10jqka.com.cn/300548" rel="noopener noreferrer" style="word-break:break-all;cursor:pointer;color:#36F" target="_blank">长芯博创（300548）</a></span>提问， 能否透露下贵司7月底签的海外45亿光纤光缆订单对贵司今后光器件、光模块在北美的销售拓展有什么促进作用？</p><p>公司回答表示，感谢您对公司的关注！公司于2026年7月27日披露子公司长芯盛与某现有客户签署约45亿元光纤光缆长期协议，该协议采用净额法确认收入，预计不会对业绩构成重大影响，本次合作有助于深化与该客户的合作关系，对公司市场拓展具有积极意义。</p><p class="brokers_hidden"><strong><span><a class="link-wrapper link-blue" href="//irm.cninfo.com.cn/ircs/search?keyword=300548" rel="noopener noreferrer" style="word-break:break-all;cursor:pointer;color:#36F" target="_blank">点击进入交易所官方互动平台查看更多</a></span></strong></p></div>
